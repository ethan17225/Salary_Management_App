services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      - OCR_RUNTIME=${OCR_RUNTIME:-docker}
      - VISION_API_BASE_URL=${VISION_API_BASE_URL:-http://host.docker.internal:11434/v1}
      - VISION_MODEL_NAME=${VISION_MODEL_NAME:-qwen2.5vl:3b}
      - VISION_API_KEY=${VISION_API_KEY:-ollama}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - payday-data:/data   # SQLite database lives here; survives rebuilds and `down`
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${PAYDAY_PORT:-8080}:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  payday-data:
